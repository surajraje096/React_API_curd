<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"> 
    <title>Document</title>
</head>
<body>
  <body>
<h1 class="text-center">Regular button</h1>

    <div class="container mt-5 d-flex justify-content-center">
       <button class="btn btn-primary">Primary Button</button>
    </div>

    <div class="container mt-5 d-flex justify-content-center">
       <button class="btn btn-secondary">Secondary Button</button>
    </div>

    <div class="container mt-5 d-flex justify-content-center">
       <button class="btn btn-success">Success Button</button>
    </div>

    <div class="container mt-5 d-flex justify-content-center">
      <button class="btn btn-danger">Danger Button</button>   
    </div>

    <div class="container mt-5 d-flex justify-content-center">
      <button class="btn btn-warning">Warning Button</button>
    </div>

    <div class="container mt-5 d-flex justify-content-center">
      <button class="btn btn-info">Info Button</button>
    </div>

    <div class="container mt-5 d-flex justify-content-center">
       <button class="btn btn-light">Light Button</button>
    </div>   
    
    <div class="container mt-5 d-flex justify-content-center">
      <button class="btn btn-link">Link Button</button>   
    </div>

    <a class="btn btn-primary" href="#" role="button">Link</a>

  <h1 class="text-center">Outline button</h1>
    <div class="container mt-5 d-flex justify-content-center">
       <button class="btn btn-outline-primary">Primary Button</button>
    </div>      
    <div class="container mt-5 d-flex justify-content-center">
       <button class="btn btn-outline-secondary">Secondary Button</button>
    </div>  
    <div class="container mt-5 d-flex justify-content-center">
       <button class="btn btn-outline-success">Success Button</button>
    </div>  
    <div class="container mt-5 d-flex justify-content-center">
      <button class="btn btn-outline-danger">Danger Button</button>   
    </div>  
    <div class="container mt-5 d-flex justify-content-center">
      <button class="btn btn-outline-warning">Warning Button</button>
    </div>  
    <div class="container mt-5 d-flex justify-content-center">
      <button class="btn btn-outline-info">Info Button</button>
    </div>  
    <div class="container mt-5 d-flex justify-content-center">
       <button class="btn btn-outline-light">Light Button</button>
    </div>   
    <div class="container mt-5 d-flex justify-content-center">
      <button class="btn btn-outline-dark">Dark Button</button>   
    </div>  
    <div class="container mt-5 d-flex justify-content-center">
      <button class="btn btn-outline-link">Link Button</button>   
    </div>

    <h1 class="text-center">Disible button</h1>
    <div class="container mt-5 d-flex justify-content-center">
       <button class="btn btn-primary" disabled>Primary Button</button>
    </div>      
    <div class="container mt-5 d-flex justify-content-center">
       <button class="btn btn-secondary" disabled>Secondary Button</button> 
    </div> 
    <div class="container mt-5 d-flex justify-content-center">
       <button class="btn btn-success" disabled>Success Button</button>
    </div>  
    <div class="container mt-5 d-flex justify-content-center">
      <button class="btn btn-danger" disabled>Danger Button</button>   
    </div>
    <div class="container mt-5 d-flex justify-content-center">
      <button class="btn btn-warning" disabled>Warning Button</button>
    </div>  
    <div class="container mt-5 d-flex justify-content-center">
      <button class="btn btn-info" disabled>Info Button</button>
    </div>              
    <div class="container mt-5 d-flex justify-content-center">
       <button class="btn btn-light" disabled>Light Button</button>
    </div>   
    <div class="container mt-5 d-flex justify-content-center">
      <button class="btn btn-link" disabled>Link Button</button>    
    </div>

    



    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    

</body>
</html>
