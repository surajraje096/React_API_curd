<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <style>
        body {
            background: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .login-container {
            background: #333;
            border-radius: 12px;
            width: 350px;
            margin: 80px auto;
            padding: 32px 28px 40px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.33);
        }
        h2 {
            text-align: center;
            margin-bottom: 18px;
            font-size: 20px;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 15px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #888;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background: #0057FF;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        .or {
            text-align: center;
            margin: 25px 0 15px;
            color: #bbb;
        }
        .social-btn {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            margin-top: 8px;
            cursor: pointer;
        }
        .google { background: #4285F4; color: #fff; }
        .facebook { background: #3B5998; color: #fff; }
        .apple { background: #000; color: #fff; }
        .terms {
            font-size: 13px;
            color: #bbb;
            margin-top: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Sign</h2>
        <form>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email here" required>
            </div>
            <button class="btn" type="submit">Continue</button>
        </form>
        <div class="or">or</div>
        <button class="social-btn google">Continue with Google</button>
        <button class="social-btn facebook">Continue with Facebook</button>
        <button class="social-btn apple">Continue with Apple</button>
        <div class="terms">
            By signing up, you agree to the Terms of Service and Privacy Policy, including Cookie Use.
        </div>
    </div>
</body>
</html>
